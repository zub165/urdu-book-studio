name: urdu_book_studio
description: Multilingual book writing studio with Urdu RTL support and e-book export.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  archive: ^3.6.1
  uuid: ^4.4.0
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  web: ^1.1.2
  payv: ^0.1.2
  http: ^1.2.2
  xml: ^6.5.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Noto Nastaliq Urdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
    - family: Noto Naskh Arabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf
